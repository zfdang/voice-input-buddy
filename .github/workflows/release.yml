name: macOS installer and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Generate shared release changes
        run: |
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/published-releases.json"
          git fetch origin --tags
          python3 scripts/generate-release-notes.py --commit "$GITHUB_SHA" --repository "$GH_REPO" \
            --releases-file "$RUNNER_TEMP/published-releases.json" \
            --output release-notes.md --summary-output release-changes.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-changelog
          path: |
            release-notes.md
            release-changes.txt
          if-no-files-found: error

  build:
    needs: changelog
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    env:
      BUILD_ARCH: ${{ matrix.arch }}
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    outputs:
      tag: ${{ steps.version.outputs.RELEASE_TAG }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Compute deterministic release version
        id: version
        run: |
          scripts/release-metadata.sh | tee "$RUNNER_TEMP/release-version"
          cat "$RUNNER_TEMP/release-version" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/release-version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-changelog
          path: ${{ runner.temp }}/release-changelog
      - name: Pre-populate Sparkle binary package cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target_dir="$HOME/Library/Caches/org.swift.swiftpm/artifacts"
          mkdir -p "$target_dir"
          cached_file="$target_dir/https___github_com_sparkle_project_Sparkle_releases_download_2_9_4_Sparkle_for_Swift_Package_Manager_zip"
          expected_sha="cb6fdbdc8884f15d62a616e79face92b08322410fd2d425edc6596ccbf4ba3b0"
          if [[ ! -f "$cached_file" ]] || ! shasum -a 256 "$cached_file" | grep -q "$expected_sha"; then
            echo "Pre-fetching Sparkle binary package via GitHub API..."
            gh api repos/sparkle-project/Sparkle/releases/assets/463901481 -H "Accept: application/octet-stream" > "$cached_file"
          fi
      - name: Test
        run: |
          python3 scripts/test-release-notes.py
          python3 scripts/test-release-metadata.py
          python3 scripts/test-release-sources.py
          python3 scripts/test-common-phrases.py
          python3 scripts/test-dependency-checkout.py
          python3 scripts/test-app-bundle.py
          python3 scripts/test-installation-actions.py
          python3 scripts/test-app-ownership.py
          python3 scripts/test-appcast.py
          python3 scripts/test-pages-update-feeds.py
          python3 scripts/test-update-signature.py
          python3 scripts/test-release-signing.py
          python3 scripts/test-sign-bundle.py
          python3 scripts/test-installer-product.py
          swift test --disable-keychain
      - name: Import fixed release signing identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: python3 scripts/release-signing-keychain.py setup
      - name: Build app, driver, and standalone uninstaller
        run: |
          scripts/build-app.sh
          scripts/build-driver.sh
          python3 scripts/test-driver-identity.py
          if [[ "$BUILD_ARCH" == arm64 ]]; then scripts/build-uninstaller.sh; fi
          test "$(lipo -archs 'dist/Remote Buddy.app/Contents/MacOS/RemoteBuddy')" = "$BUILD_ARCH"
          test "$(lipo -archs dist/RemoteBuddyMic.driver/Contents/MacOS/RemoteBuddyMic)" = "$BUILD_ARCH"
      - name: Verify fixed release signing identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 scripts/verify-release-signing.py
      - name: Package app and driver
        run: |
          scripts/build-release-package.sh
          scripts/verify-release-package.sh
      - name: Sign and verify production update package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RELEASE_CHANGES_FILE: ${{ runner.temp }}/release-changelog/release-changes.txt
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: scripts/sign-release-update.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: macOS-release-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
      - name: Remove release signing keychain
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 scripts/release-signing-keychain.py cleanup

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: macOS-release-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-changelog
          path: .
      - name: Check immutable release state
        id: release_state
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            echo "exists=true" >> "$GITHUB_OUTPUT"
            gh release view "$RELEASE_TAG" --json tagName,assets > "$RUNNER_TEMP/release.json"
            existing_assets="$(jq -r '.assets[].name' "$RUNNER_TEMP/release.json")"
            if grep -q '^appcast-arm64\.xml$' <<< "$existing_assets" && grep -q '^appcast-intel\.xml$' <<< "$existing_assets"; then
              echo "Downloading published feeds from existing release $RELEASE_TAG..."
              gh release download "$RELEASE_TAG" --pattern "appcast-*.xml" --dir release --clobber
              python3 scripts/verify-pages-update-feeds.py release "$RUNNER_TEMP/release.json"
            else
              echo "Error: Release $RELEASE_TAG exists but is missing update feed assets." >&2
              echo "Cannot upload newly built feeds because package signatures may not match the published release." >&2
              echo "Please use scripts/rebuild-pages-update-feeds.py with the release signing key to rebuild feeds from published packages." >&2
              exit 1
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload website update feeds
        uses: actions/upload-artifact@v7.0.2
        with:
          name: website-update-feeds
          overwrite: true
          path: release/appcast-*.xml
          if-no-files-found: error
          retention-days: 90
      - name: Publish release
        shell: bash
        run: |
          if [[ "${{ steps.release_state.outputs.exists }}" == 'true' ]]; then
            echo "Release $RELEASE_TAG already exists; packages and feeds are immutable."
          else
            gh release create "$RELEASE_TAG" \
              "release/Remote_Buddy_${RELEASE_TAG}_macOS_arm64.pkg" \
              "release/Remote_Buddy_${RELEASE_TAG}_macOS_intel.pkg" \
              "release/Remote_Buddy_Uninstaller_${RELEASE_TAG}_macOS_universal.pkg" \
              "release/appcast-arm64.xml" \
              "release/appcast-intel.xml" \
              --target "$RELEASE_COMMIT" \
              --title "$RELEASE_TAG" --notes-file release-notes.md --latest
          fi
