name: macOS installer and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changelog:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Generate shared release changes
        run: |
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/published-releases.json"
          git fetch origin --tags
          python3 scripts/generate-release-notes.py --commit "$GITHUB_SHA" --repository "$GH_REPO" \
            --releases-file "$RUNNER_TEMP/published-releases.json" \
            --output release-notes.md --summary-output release-changes.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-changelog
          path: |
            release-notes.md
            release-changes.txt
          if-no-files-found: error

  build:
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON((github.event_name == 'push' && github.ref == 'refs/heads/main') && '["arm64", "x86_64"]' || '["arm64"]') }}
    env:
      BUILD_ARCH: ${{ matrix.arch }}
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    outputs:
      tag: ${{ steps.version.outputs.RELEASE_TAG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compute deterministic release version
        id: version
        run: |
          scripts/release-metadata.sh | tee "$RUNNER_TEMP/release-version"
          cat "$RUNNER_TEMP/release-version" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/release-version" >> "$GITHUB_OUTPUT"
      - name: Cache Sparkle artifact and BlackHole driver source
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm/artifacts
            .build/buddy-driver
          key: ${{ runner.os }}-${{ matrix.arch }}-deps-v1-${{ hashFiles('Package.resolved', 'Package.swift', 'scripts/build-driver.sh', 'third_party/blackhole/device-usb.patch') }}
      - name: Pre-populate Sparkle binary package cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target_dir="$HOME/Library/Caches/org.swift.swiftpm/artifacts"
          mkdir -p "$target_dir"
          cached_file="$target_dir/https___github_com_sparkle_project_Sparkle_releases_download_2_9_4_Sparkle_for_Swift_Package_Manager_zip"
          expected_sha="cb6fdbdc8884f15d62a616e79face92b08322410fd2d425edc6596ccbf4ba3b0"
          if [[ ! -f "$cached_file" ]] || ! shasum -a 256 "$cached_file" | grep -q "$expected_sha"; then
            echo "Pre-fetching Sparkle binary package via GitHub API..."
            rm -f "$cached_file"
            gh api repos/sparkle-project/Sparkle/releases/assets/463901481 -H "Accept: application/octet-stream" > "$cached_file"
            if ! shasum -a 256 "$cached_file" | grep -q "$expected_sha"; then
              echo "Warning: Sparkle cache pre-fetch failed verification; removing corrupted cache file." >&2
              rm -f "$cached_file"
            fi
          fi
      - name: Restore incremental SwiftPM build cache
        id: build-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .build/${{ matrix.arch }}-apple-macosx
            .build/app-${{ matrix.arch }}
            .build/artifacts
            .build/checkouts
            .build/repositories
            .build/build.db
            .build/debug.yaml
            .build/release.yaml
            .build/plugin-tools.yaml
            .build/workspace-state.json
            .build/debug
            .build/release
            .build/.cached-git-sha
          key: ${{ runner.os }}-${{ matrix.arch }}-swift-v2-xcode26.2-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-swift-v2-xcode26.2-${{ hashFiles('Package.resolved', 'Package.swift') }}-main-
            ${{ runner.os }}-${{ matrix.arch }}-swift-v2-xcode26.2-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.ref_name }}-
            ${{ runner.os }}-${{ matrix.arch }}-swift-v2-xcode26.2-${{ hashFiles('Package.resolved', 'Package.swift') }}-
      - name: Restore Git commit timestamps for incremental compilation
        run: python3 scripts/restore-git-mtimes.py --marker-file .build/.cached-git-sha
      - name: Test
        run: |
          python3 - <<'PY'
          import concurrent.futures, subprocess, sys

          scripts = [
              "scripts/test-release-notes.py",
              "scripts/test-release-metadata.py",
              "scripts/test-release-sources.py",
              "scripts/test-restore-git-mtimes.py",
              "scripts/test-common-phrases.py",
              "scripts/test-dependency-checkout.py",
              "scripts/test-app-bundle.py",
              "scripts/test-installation-actions.py",
              "scripts/test-app-ownership.py",
              "scripts/test-appcast.py",
              "scripts/test-pages-update-feeds.py",
              "scripts/test-update-signature.py",
              "scripts/test-release-signing.py",
              "scripts/test-sign-bundle.py",
              "scripts/test-installer-product.py",
              "scripts/test-local-signed-build.py",
          ]

          def run_script(path):
              proc = subprocess.run([sys.executable, path], capture_output=True, text=True)
              return path, proc.returncode, proc.stdout, proc.stderr

          failed = False
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              for path, code, out, err in pool.map(run_script, scripts):
                  print(f"=== {path} (exit {code}) ===")
                  if out:
                      print(out, end="" if out.endswith("\n") else "\n")
                  if err:
                      print(err, file=sys.stderr, end="" if err.endswith("\n") else "\n")
                  if code != 0:
                      failed = True
          if failed:
              sys.exit(1)
          PY
          swift test --disable-keychain
      - name: Import fixed release signing identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: python3 scripts/release-signing-keychain.py setup
      - name: Build app, driver, and standalone uninstaller
        env:
          CONFIGURATION: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'release' || 'debug' }}
          APP_BUILD_SCRATCH_PATH: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && format('{0}/.build/app-{1}', github.workspace, matrix.arch) || format('{0}/.build', github.workspace) }}
        run: |
          scripts/build-app.sh
          scripts/build-driver.sh
          python3 scripts/test-driver-identity.py
          if [[ "$BUILD_ARCH" == arm64 ]]; then scripts/build-uninstaller.sh; fi
          test "$(lipo -archs 'dist/Remote Buddy.app/Contents/MacOS/RemoteBuddy')" = "$BUILD_ARCH"
          test "$(lipo -archs dist/RemoteBuddyMic.driver/Contents/MacOS/RemoteBuddyMic)" = "$BUILD_ARCH"
      - name: Verify fixed release signing identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 scripts/verify-release-signing.py
      - name: Package app and driver
        run: |
          scripts/build-release-package.sh
          scripts/verify-release-package.sh
          if [[ "$BUILD_ARCH" == arm64 && "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then scripts/build-release-sources.sh; fi
      - name: Download shared release changelog
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHANGELOG_DIR: ${{ runner.temp }}/release-changelog
        run: |
          dest="$CHANGELOG_DIR"
          mkdir -p "$dest"
          for attempt in $(seq 1 40); do
            if gh run download "$GITHUB_RUN_ID" --repo "$GH_REPO" --name release-changelog --dir "$dest" >/dev/null 2>&1; then
              test -s "$dest/release-changes.txt"
              exit 0
            fi
            sleep 3
          done
          echo "Timed out waiting for release-changelog artifact." >&2
          exit 1
      - name: Sign and verify production update package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RELEASE_CHANGES_FILE: ${{ runner.temp }}/release-changelog/release-changes.txt
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: scripts/sign-release-update.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: macOS-release-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
      - name: Remove release signing keychain
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 scripts/release-signing-keychain.py cleanup
      - name: Record SwiftPM cache marker
        if: success() && steps.build-cache.outputs.cache-hit != 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || steps.build-cache.outputs.cache-matched-key == '')
        run: python3 scripts/restore-git-mtimes.py --write-marker --marker-file .build/.cached-git-sha
      - name: Save incremental SwiftPM build cache
        if: success() && steps.build-cache.outputs.cache-hit != 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || steps.build-cache.outputs.cache-matched-key == '')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .build/${{ matrix.arch }}-apple-macosx
            .build/app-${{ matrix.arch }}
            .build/artifacts
            .build/checkouts
            .build/repositories
            .build/build.db
            .build/debug.yaml
            .build/release.yaml
            .build/plugin-tools.yaml
            .build/workspace-state.json
            .build/debug
            .build/release
            .build/.cached-git-sha
          key: ${{ runner.os }}-${{ matrix.arch }}-swift-v2-xcode26.2-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.ref_name }}-${{ github.sha }}

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [changelog, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: macOS-release-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-changelog
          path: .
      - name: Check immutable release state
        id: release_state
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            echo "exists=true" >> "$GITHUB_OUTPUT"
            gh release view "$RELEASE_TAG" --json tagName,assets > "$RUNNER_TEMP/release.json"
            existing_assets="$(jq -r '.assets[].name' "$RUNNER_TEMP/release.json")"
            if grep -q '^appcast-arm64\.xml$' <<< "$existing_assets" && grep -q '^appcast-intel\.xml$' <<< "$existing_assets"; then
              echo "Downloading published feeds from existing release $RELEASE_TAG..."
              gh release download "$RELEASE_TAG" --pattern "appcast-*.xml" --dir release --clobber
              python3 scripts/verify-pages-update-feeds.py release "$RUNNER_TEMP/release.json"
            else
              echo "Error: Release $RELEASE_TAG exists but is missing update feed assets." >&2
              echo "Cannot upload newly built feeds because package signatures may not match the published release." >&2
              echo "To recover, please use scripts/rebuild-pages-update-feeds.py with the release signing key and upload feeds using: gh release upload $RELEASE_TAG pages/appcast-*.xml" >&2
              exit 1
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload website update feeds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-update-feeds
          overwrite: true
          path: release/appcast-*.xml
          if-no-files-found: error
          retention-days: 90
      - name: Publish release
        shell: bash
        env:
          RELEASE_EXISTS: ${{ steps.release_state.outputs.exists }}
        run: |
          if [[ "$RELEASE_EXISTS" == 'true' ]]; then
            echo "Release $RELEASE_TAG already exists; packages and feeds are immutable."
          else
            gh release create "$RELEASE_TAG" \
              "release/Remote_Buddy_${RELEASE_TAG}_macOS_arm64.pkg" \
              "release/Remote_Buddy_${RELEASE_TAG}_macOS_intel.pkg" \
              "release/Remote_Buddy_Uninstaller_${RELEASE_TAG}_macOS_universal.pkg" \
              "release/Remote_Buddy_${RELEASE_TAG}_sources.tar.gz" \
              "release/appcast-arm64.xml" \
              "release/appcast-intel.xml" \
              --target "$RELEASE_COMMIT" \
              --title "$RELEASE_TAG" --notes-file release-notes.md --latest
          fi
